version: '3.4'
services:

  jobmanager:
    image: flink:1.5.1-alpine
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

  taskmanager:
    image: flink:1.5.1-alpine
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

  deployer:
    build: .
    image: nielsdenissen/flink-deployer:latest
    depends_on:
      - jobmanager
      - taskmanager
    command: 
      - "deploy"
      # - "-job-name-base"
      # - "${FLINK_JOB_NAME}"
      - "-file-name"
      - "/tmp/flink-sample-job/flink-stateful-wordcount-assembly-0.jar"
      - "-run-args"
      - "-p 2 -d -c WordCountStateful"
      - "-jar-args"
      - "--intervalMs 1000"
      # - "-savepoint-dir"
      # - "/data/flink/savepoints"
    volumes:
      - ./flink-sample-job/target/scala-2.11/:/tmp/flink-sample-job
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - JOB_MANAGER_RPC_PORT=6123
